services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: refund
      POSTGRES_PASSWORD: refund
      POSTGRES_DB: refunds
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refund -d refunds"]
      interval: 3s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://refund:refund@db:5432/refunds
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
